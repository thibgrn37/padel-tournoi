name: Build Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  mac:
    needs: tests
    # Mac Intel : les Mac Apple Silicon de GitHub sont saturés ; l app produite reste universelle
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Application universelle (Mac Apple Silicon et Intel), publiée dans « Releases »
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: build-${{ github.run_number }}
          releaseName: Padel Tournoi (build ${{ github.run_number }})
          releaseBody: Télécharger le fichier .dmg ci-dessous, l'ouvrir et glisser Padel Tournoi dans Applications.
          prerelease: false
